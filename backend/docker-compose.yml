version: '3.9'

services:

  mongodb:
    image: mongo:7

    container_name: skiller_mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16

    container_name: skiller_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skiller

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongo_data:
  postgres_data: